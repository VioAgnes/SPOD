[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidhalluc-code"
version = "0.1.0"
description = "Spatial and temporal evidence interventions for video hallucination evaluation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
vidhalluc = "vidhalluc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
vidhalluc = ["resources/*.json"]
